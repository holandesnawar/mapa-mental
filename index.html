<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Mapas Mentales</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f6f8; color: #1c1d21; overflow: hidden;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; height: 100vh; height: 100dvh; width: 100vw; }

  /* Sidebar */
  #sidebar {
    width: 230px; min-width: 230px; background: #ffffff; border-right: 1px solid #e4e6eb;
    display: flex; flex-direction: column; height: 100%;
  }
  #sidebar h1 { font-size: 15px; padding: 16px 16px 8px; color: #1c1d21; font-weight: 700; }
  #sidebar .sub { font-size: 11px; color: #8a8d96; padding: 0 16px 12px; }
  #mapList { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .map-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px;
    cursor: pointer; font-size: 13px; color: #3a3c44; margin-bottom: 2px;
  }
  .map-item:hover { background: #f0f1f4; }
  .map-item.active { background: #e8eefc; color: #1652d6; font-weight: 600; }
  .map-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-item .del { opacity: 0; font-size: 14px; color: #b0b3bc; padding: 0 4px; }
  .map-item:hover .del { opacity: 1; }
  .map-item .del:hover { color: #e0455e; }
  #newMapBtn {
    margin: 8px 12px 16px; padding: 10px; border: 1px dashed #c4c7d0; background: #fff;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: #3a3c44; font-weight: 500;
  }
  #newMapBtn:hover { border-color: #1652d6; color: #1652d6; }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; min-width: 0; }
  #toolbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #fff;
    border-bottom: 1px solid #e4e6eb; flex-wrap: wrap;
  }
  #toolbar .title { font-size: 14px; font-weight: 600; margin-right: auto; color: #1c1d21; }
  .btn {
    border: 1px solid #d7d9e0; background: #fff; border-radius: 7px; padding: 7px 12px;
    font-size: 13px; cursor: pointer; color: #3a3c44; display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .btn:hover { background: #f0f1f4; }
  .btn.primary { background: #1652d6; color: #fff; border-color: #1652d6; }
  .btn.primary:hover { background: #1145bb; }
  .btn:disabled { opacity: .45; cursor: default; }

  /* Canvas */
  #canvas { flex: 1; position: relative; overflow: hidden; cursor: grab; background:
    radial-gradient(#e4e6eb 1px, transparent 1px); background-size: 22px 22px;
    touch-action: none; }
  #canvas.panning { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  .node {
    position: absolute; min-width: 90px; max-width: 230px; padding: 10px 14px;
    border-radius: 12px; background: #fff; border: 2px solid #d7d9e0;
    box-shadow: 0 2px 8px rgba(20,30,60,0.08); font-size: 13px; line-height: 1.35;
    cursor: pointer; user-select: none; transition: box-shadow .12s, transform .12s;
    touch-action: none;
  }
  .node:hover { box-shadow: 0 4px 14px rgba(20,30,60,0.16); }
  .node.selected { box-shadow: 0 0 0 3px rgba(22,82,214,0.35), 0 4px 14px rgba(20,30,60,0.16); }
  .node.central { font-weight: 700; font-size: 15px; padding: 14px 20px; }
  .node .label { outline: none; word-wrap: break-word; white-space: pre-wrap; }
  .node .label[contenteditable="true"] { cursor: text; }
  .node .note-badge { display: block; font-size: 11px; color: #8a8d96; margin-top: 5px;
    border-top: 1px dashed currentColor; padding-top: 5px; opacity: .8; white-space: pre-wrap; }

  /* Collapse/expand toggle (right side) */
  .node .toggle {
    position: absolute; right: -13px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    border: 2px solid currentColor; color: inherit; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; z-index: 2;
  }
  .node .toggle:hover { background: currentColor; }
  .node .toggle:hover span { color: #fff; }
  .node .toggle span { color: inherit; line-height: 1; }
  /* Add-child button */
  .node .add {
    position: absolute; right: -12px; bottom: -12px; width: 22px; height: 22px;
    border-radius: 50%; background: #1652d6; color: #fff; border: 2px solid #fff;
    display: none; align-items: center; justify-content: center; font-size: 15px;
    line-height: 1; cursor: pointer; z-index: 3; box-shadow: 0 2px 6px rgba(20,30,60,.25);
  }
  .node:hover .add, .node.selected .add { display: flex; }

  /* Inspector panel */
  #panel {
    position: absolute; right: 16px; top: 70px; width: 250px; background: #fff;
    border: 1px solid #e4e6eb; border-radius: 12px; box-shadow: 0 8px 30px rgba(20,30,60,0.16);
    padding: 14px; display: none; z-index: 20;
  }
  #panel.show { display: block; }
  #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8a8d96; margin-bottom: 8px; }
  #panel label { font-size: 12px; color: #6a6d76; display: block; margin: 12px 0 5px; }
  #panel textarea {
    width: 100%; min-height: 64px; border: 1px solid #d7d9e0; border-radius: 8px; padding: 8px;
    font-size: 13px; font-family: inherit; resize: vertical;
  }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid #fff;
    box-shadow: 0 0 0 1px #d7d9e0; }
  .swatch.sel { box-shadow: 0 0 0 2px #1c1d21; }
  #panel .row { display: flex; gap: 8px; margin-top: 12px; }
  #panel .row .btn { flex: 1; justify-content: center; }
  #deleteNode { color: #e0455e; border-color: #f0c3cb; }
  #deleteNode:hover { background: #fdeef1; }

  /* Modal */
  #modalBg { position: fixed; inset: 0; background: rgba(20,25,40,.35); display: none;
    align-items: center; justify-content: center; z-index: 100; }
  #modalBg.show { display: flex; }
  #modal { background: #fff; border-radius: 14px; padding: 22px; width: 320px; max-width: 90vw;
    box-shadow: 0 20px 60px rgba(20,30,60,.3); }
  #modal h3 { font-size: 15px; margin-bottom: 14px; color: #1c1d21; }
  #modal input { width: 100%; border: 1px solid #d7d9e0; border-radius: 8px; padding: 10px;
    font-size: 14px; font-family: inherit; margin-bottom: 16px; }
  #modal input:focus { outline: none; border-color: #1652d6; }
  #modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  #modalMsg { font-size: 13px; color: #6a6d76; margin-bottom: 16px; line-height: 1.4; }

  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(28,29,33,.85); color: #fff; font-size: 12px; padding: 7px 14px;
    border-radius: 20px; pointer-events: none; opacity: 0; transition: opacity .3s;
    max-width: 90%; text-align: center; }
  #hint.show { opacity: 1; }
  #zoomctl { position: absolute; bottom: 14px; right: 16px; display: flex; gap: 6px; }
  #zoomctl .btn { padding: 6px 10px; }
  .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: #a0a3ac; font-size: 14px; pointer-events: none; padding: 0 20px; }

  /* Mobile / tablet */
  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; min-width: 0; height: auto; max-height: 38vh;
      border-right: none; border-bottom: 1px solid #e4e6eb; }
    #sidebar h1 { font-size: 14px; padding: 10px 14px 4px; }
    #sidebar .sub { padding: 0 14px 8px; }
    #mapList { max-height: 22vh; }
    #newMapBtn { margin: 6px 12px 10px; }
    #toolbar { gap: 6px; padding: 8px 10px; }
    #toolbar .title { width: 100%; margin: 0 0 2px; }
    .btn { padding: 8px 11px; }
    #panel { right: 8px; left: 8px; top: auto; bottom: 8px; width: auto; }
    .map-item .del { opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>🧠 Mis Mapas Mentales</h1>
    <div class="sub">Una idea raíz y ramas que se despliegan</div>
    <div id="mapList"></div>
    <button id="newMapBtn">+ Nuevo mapa</button>
  </aside>

  <div id="main">
    <div id="toolbar">
      <span class="title" id="mapTitle"></span>
      <button class="btn primary" id="addNode">+ Rama</button>
      <button class="btn" id="collapseAll">⊟ Plegar</button>
      <button class="btn" id="expandAll">⊞ Desplegar</button>
      <button class="btn" id="exportPng">⤓ PNG</button>
      <button class="btn" id="exportJson">⤓ JSON</button>
      <button class="btn" id="importJson">⤒ Importar</button>
      <input type="file" id="fileInput" accept="application/json" style="display:none">
    </div>

    <div id="canvas">
      <div id="world">
        <svg id="edges"></svg>
      </div>
      <div class="empty-state" id="emptyState"></div>
      <div id="hint"></div>
      <div id="zoomctl">
        <button class="btn" id="zoomOut">−</button>
        <button class="btn" id="zoomReset">100%</button>
        <button class="btn" id="zoomIn">+</button>
      </div>
    </div>

    <div id="panel">
      <h3>Editar idea</h3>
      <label>Color de la rama</label>
      <div class="swatches" id="swatches"></div>
      <label>Nota (texto largo)</label>
      <textarea id="noteInput" placeholder="Detalles, ideas, recordatorios..."></textarea>
      <div class="row">
        <button class="btn" id="addChildBtn">➕ Rama hija</button>
        <button class="btn" id="addSibBtn">↳ Hermana</button>
      </div>
      <div class="row">
        <button class="btn" id="deleteNode">🗑 Eliminar rama</button>
      </div>
    </div>
  </div>
</div>

<div id="modalBg">
  <div id="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalMsg" style="display:none"></div>
    <input id="modalInput" type="text">
    <div class="actions">
      <button class="btn" id="modalCancel">Cancelar</button>
      <button class="btn primary" id="modalOk">Aceptar</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = "mindmaps_v2";
const COLORS = [
  { name:"Azul",   border:"#1652d6", bg:"#eaf0fd", text:"#13316e" },
  { name:"Verde",  border:"#1f9d57", bg:"#e8f7ee", text:"#0e5e33" },
  { name:"Morado", border:"#7c3aed", bg:"#f1ebfd", text:"#4a1d99" },
  { name:"Naranja",border:"#e08c1a", bg:"#fdf2e0", text:"#8a530a" },
  { name:"Rosa",   border:"#db2f78", bg:"#fdeaf2", text:"#8c1748" },
  { name:"Gris",   border:"#6a6d76", bg:"#f0f1f4", text:"#33353c" },
  { name:"Rojo",   border:"#e0455e", bg:"#fdebee", text:"#8c2233" },
  { name:"Teal",   border:"#0d9488", bg:"#e3f6f4", text:"#075650" },
];
const H_GAP = 64;   // separación horizontal entre niveles
const V_GAP = 18;   // separación vertical entre ramas

// ---- helpers de árbol (declaraciones hoisted: disponibles desde load()) ----
function uid() { return Math.random().toString(36).slice(2, 9); }
function newNode(text, color) {
  return { id: uid(), text: text || "Idea", note: "", color: color || 0, collapsed: false, children: [] };
}
function migrateMap(m) {
  if (m.root) return m; // ya es árbol
  const nodes = m.nodes || [];
  if (!nodes.length) return { id: m.id, name: m.name, root: newNode("Idea central") };
  const byId = {};
  nodes.forEach(n => byId[n.id] = { id: n.id, text: n.text || "Idea", note: n.note || "",
    color: n.color || 0, collapsed: false, children: [] });
  const central = nodes.find(n => n.central) || nodes[0];
  const adj = {}; nodes.forEach(n => adj[n.id] = []);
  (m.edges || []).forEach(e => { if (adj[e.from] && adj[e.to]) { adj[e.from].push(e.to); adj[e.to].push(e.from); } });
  const visited = new Set([central.id]); const queue = [central.id];
  while (queue.length) {
    const id = queue.shift();
    adj[id].forEach(nb => { if (!visited.has(nb)) { visited.add(nb); byId[id].children.push(byId[nb]); queue.push(nb); } });
  }
  nodes.forEach(n => { if (!visited.has(n.id)) { byId[central.id].children.push(byId[n.id]); visited.add(n.id); } });
  return { id: m.id, name: m.name, root: byId[central.id] };
}

let state = load();
let view = { tx: 0, ty: 0, s: 1 };
let selectedId = null;

// transitorios de render (no se guardan)
let nodeEls = {};        // id -> elemento
let pos = {};            // id -> { x, y, w, h }  (x,y = esquina superior izquierda)
let visibleNodes = [];   // nodos visibles en orden
let parentMap = {};      // id -> nodo padre

// ---------- persistence ----------
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
    const old = localStorage.getItem("mindmaps_v1");
    if (old) { const s = JSON.parse(old); s.maps = s.maps.map(migrateMap); return s; }
  } catch (e) {}
  const id = "m_" + uid();
  return { activeMapId: id, maps: [{ id, name: "Mi primer mapa", root: newNode("Idea central") }] };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function activeMap() { return state.maps.find(m => m.id === state.activeMapId) || state.maps[0]; }

function findNode(id) {
  let res = null;
  (function walk(n) { if (res) return; if (n.id === id) { res = n; return; } n.children.forEach(walk); })(activeMap().root);
  return res;
}
function parentOf(id) {
  let res = null;
  (function walk(n) { if (res) return; for (const c of n.children) { if (c.id === id) { res = n; return; } walk(c); if (res) return; } })(activeMap().root);
  return res;
}

// ---------- DOM refs ----------
const canvas = document.getElementById("canvas");
const world = document.getElementById("world");
const edgesSvg = document.getElementById("edges");
const mapList = document.getElementById("mapList");
const panel = document.getElementById("panel");
const noteInput = document.getElementById("noteInput");
const swatches = document.getElementById("swatches");
const emptyState = document.getElementById("emptyState");

// ---------- modal helpers ----------
const modalBg = document.getElementById("modalBg");
const modalInput = document.getElementById("modalInput");
const modalMsg = document.getElementById("modalMsg");
let modalResolve = null;
function askText(title, value) {
  return new Promise(res => {
    document.getElementById("modalTitle").textContent = title;
    modalMsg.style.display = "none";
    modalInput.style.display = "block";
    modalInput.value = value || "";
    modalBg.classList.add("show");
    setTimeout(() => { modalInput.focus(); modalInput.select(); }, 30);
    modalResolve = res;
  });
}
function askConfirm(title, msg) {
  return new Promise(res => {
    document.getElementById("modalTitle").textContent = title;
    modalMsg.textContent = msg || "";
    modalMsg.style.display = msg ? "block" : "none";
    modalInput.style.display = "none";
    modalBg.classList.add("show");
    modalResolve = res;
  });
}
function closeModal(val) { modalBg.classList.remove("show"); if (modalResolve) { modalResolve(val); modalResolve = null; } }
document.getElementById("modalOk").addEventListener("click", () => {
  closeModal(modalInput.style.display === "none" ? true : modalInput.value);
});
document.getElementById("modalCancel").addEventListener("click", () => closeModal(null));
modalInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") closeModal(modalInput.value);
  if (e.key === "Escape") closeModal(null);
});
modalBg.addEventListener("pointerdown", (e) => { if (e.target === modalBg) closeModal(null); });

// ---------- view transform ----------
function applyView() {
  world.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.s})`;
  document.getElementById("zoomReset").textContent = Math.round(view.s * 100) + "%";
}
function screenToWorld(sx, sy) {
  const r = canvas.getBoundingClientRect();
  return { x: (sx - r.left - view.tx) / view.s, y: (sy - r.top - view.ty) / view.s };
}

// ---------- sidebar ----------
function renderSidebar() {
  mapList.innerHTML = "";
  state.maps.forEach(m => {
    const el = document.createElement("div");
    el.className = "map-item" + (m.id === state.activeMapId ? " active" : "");
    el.innerHTML = `<span>🗺</span><span class="name"></span><span class="del" title="Eliminar">✕</span>`;
    el.querySelector(".name").textContent = m.name;
    el.querySelector(".name").addEventListener("click", () => switchMap(m.id));
    el.querySelector("span:first-child").addEventListener("click", () => switchMap(m.id));
    el.querySelector(".del").addEventListener("click", (e) => { e.stopPropagation(); deleteMap(m.id); });
    el.addEventListener("dblclick", (e) => { if (e.target.classList.contains("del")) return; renameMap(m.id); });
    mapList.appendChild(el);
  });
}

// ---------- render tree ----------
function renderMap() {
  const map = activeMap();
  document.getElementById("mapTitle").textContent = map.name;
  Object.values(nodeEls).forEach(el => el.remove());
  nodeEls = {}; pos = {}; visibleNodes = []; parentMap = {};

  // 1) crear elementos de los nodos visibles
  (function walk(node, parent) {
    parentMap[node.id] = parent;
    visibleNodes.push(node);
    createNodeEl(node);
    if (!node.collapsed) node.children.forEach(c => walk(c, node));
  })(map.root, null);

  // 2) medir tamaños
  visibleNodes.forEach(n => {
    const el = nodeEls[n.id];
    pos[n.id] = { w: el.offsetWidth, h: el.offsetHeight, x: 0, y: 0 };
  });

  // 3) layout en árbol (izquierda -> derecha)
  let cursorY = 0;
  (function layout(node, x) {
    const ps = pos[node.id];
    ps.x = x;
    const kids = node.collapsed ? [] : node.children;
    if (!kids.length) {
      ps.y = cursorY;
      cursorY += ps.h + V_GAP;
    } else {
      kids.forEach(c => layout(c, x + ps.w + H_GAP));
      const f = pos[kids[0].id], l = pos[kids[kids.length - 1].id];
      ps.y = (f.y + f.h / 2 + l.y + l.h / 2) / 2 - ps.h / 2;
    }
  })(map.root, 0);

  // 4) aplicar posiciones
  visibleNodes.forEach(n => {
    const el = nodeEls[n.id], ps = pos[n.id];
    el.style.left = ps.x + "px"; el.style.top = ps.y + "px";
  });

  renderEdges();
  emptyState.style.display = "none";
  updatePanel();
}

function createNodeEl(node) {
  const map = activeMap();
  const c = COLORS[node.color || 0];
  const el = document.createElement("div");
  el.className = "node" + (node === map.root ? " central" : "") + (node.id === selectedId ? " selected" : "");
  el.style.borderColor = c.border; el.style.background = c.bg; el.style.color = c.text;
  el.dataset.id = node.id;

  const label = document.createElement("div");
  label.className = "label"; label.textContent = node.text;
  el.appendChild(label);

  if (node.note && node.note.trim()) {
    const nb = document.createElement("div");
    nb.className = "note-badge";
    nb.textContent = node.note.length > 80 ? node.note.slice(0, 80) + "…" : node.note;
    el.appendChild(nb);
  }

  // toggle plegar/desplegar (sólo si tiene hijos)
  if (node.children.length) {
    const t = document.createElement("div");
    t.className = "toggle"; t.title = node.collapsed ? "Mostrar ramas" : "Ocultar ramas";
    const sp = document.createElement("span");
    sp.textContent = node.collapsed ? node.children.length : "–";
    t.appendChild(sp);
    t.addEventListener("pointerdown", e => e.stopPropagation());
    t.addEventListener("click", e => {
      e.stopPropagation(); node.collapsed = !node.collapsed; save(); renderMap(); selectNode(node.id);
    });
    el.appendChild(t);
  }

  // botón añadir rama hija
  const add = document.createElement("div");
  add.className = "add"; add.textContent = "+"; add.title = "Añadir rama hija";
  add.addEventListener("pointerdown", e => e.stopPropagation());
  add.addEventListener("click", e => { e.stopPropagation(); addChild(node); });
  el.appendChild(add);

  // seleccionar / doble-toque para editar
  el.addEventListener("pointerdown", (e) => {
    if (e.target.classList.contains("toggle") || e.target.classList.contains("add")) return;
    if (label.getAttribute("contenteditable") === "true") return;
    e.stopPropagation();
    selectNode(node.id);
    if (e.pointerType === "touch") {
      const now = Date.now();
      if (lastTapId === node.id && now - lastTapTime < 320) { lastTapTime = 0; startEdit(label, node); }
      else { lastTapId = node.id; lastTapTime = now; }
    }
  });
  label.addEventListener("dblclick", (e) => { e.stopPropagation(); startEdit(label, node); });

  world.appendChild(el);
  nodeEls[node.id] = el;
}
let lastTapId = null, lastTapTime = 0;

function renderEdges() {
  let html = "";
  visibleNodes.forEach(n => {
    const p = parentMap[n.id]; if (!p) return;
    const a = pos[p.id], b = pos[n.id];
    const ax = a.x + a.w, ay = a.y + a.h / 2;
    const bx = b.x, by = b.y + b.h / 2;
    const mx = (ax + bx) / 2;
    const col = COLORS[n.color || 0].border;
    html += `<path d="M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}" stroke="${col}" stroke-width="2.5" fill="none" opacity="0.55"/>`;
  });
  edgesSvg.innerHTML = html;
}

// ---------- editar texto ----------
function startEdit(label, node) {
  label.setAttribute("contenteditable", "true");
  label.focus();
  const range = document.createRange();
  range.selectNodeContents(label);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  const finish = () => {
    label.removeEventListener("blur", finish);
    label.removeEventListener("keydown", key);
    label.removeAttribute("contenteditable");
    node.text = label.textContent.trim() || "Idea";
    save(); renderMap(); selectNode(node.id);
  };
  const key = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); label.blur(); }
    if (e.key === "Escape") { label.textContent = node.text; label.blur(); }
  };
  label.addEventListener("blur", finish);
  label.addEventListener("keydown", key);
}

// ---------- selección / panel ----------
function selectNode(id) {
  selectedId = id;
  Object.entries(nodeEls).forEach(([nid, el]) => el.classList.toggle("selected", nid === id));
  updatePanel();
}
function deselect() {
  selectedId = null;
  Object.values(nodeEls).forEach(el => el.classList.remove("selected"));
  panel.classList.remove("show");
}
function updatePanel() {
  const n = selectedId ? findNode(selectedId) : null;
  if (!n) { panel.classList.remove("show"); return; }
  panel.classList.add("show");
  noteInput.value = n.note || "";
  const isRoot = !parentOf(n.id);
  document.getElementById("deleteNode").disabled = isRoot;
  document.getElementById("addSibBtn").disabled = isRoot;
  swatches.innerHTML = "";
  COLORS.forEach((c, i) => {
    const s = document.createElement("div");
    s.className = "swatch" + (i === (n.color || 0) ? " sel" : "");
    s.style.background = c.border; s.title = c.name;
    s.addEventListener("click", () => { n.color = i; save(); renderMap(); selectNode(n.id); });
    swatches.appendChild(s);
  });
}
noteInput.addEventListener("input", () => {
  const n = selectedId ? findNode(selectedId) : null;
  if (n) { n.note = noteInput.value; save(); }
});
noteInput.addEventListener("blur", () => renderMap());

// ---------- crear / borrar ramas ----------
function addChild(parentNode) {
  if (!parentNode) parentNode = activeMap().root;
  const child = newNode("Nueva idea", (parentNode.color + 1) % COLORS.length);
  parentNode.children.push(child);
  parentNode.collapsed = false;
  save(); renderMap(); selectNode(child.id); centerOn(child.id);
  setTimeout(() => { const el = nodeEls[child.id]; if (el) startEdit(el.querySelector(".label"), child); }, 30);
}
function addSibling(node) {
  const parent = parentOf(node.id);
  if (!parent) { addChild(node); return; } // la raíz no tiene hermana -> crea hija
  const sib = newNode("Nueva idea", node.color);
  const idx = parent.children.indexOf(node);
  parent.children.splice(idx + 1, 0, sib);
  save(); renderMap(); selectNode(sib.id); centerOn(sib.id);
  setTimeout(() => { const el = nodeEls[sib.id]; if (el) startEdit(el.querySelector(".label"), sib); }, 30);
}
function deleteSelected() {
  if (!selectedId) return;
  const node = findNode(selectedId);
  const parent = parentOf(selectedId);
  if (!parent) { showHint("No puedes eliminar la idea raíz"); return; }
  parent.children = parent.children.filter(c => c.id !== node.id);
  deselect(); save(); renderMap();
}
document.getElementById("addNode").addEventListener("click", () => addChild(selectedId ? findNode(selectedId) : null));
document.getElementById("addChildBtn").addEventListener("click", () => { if (selectedId) addChild(findNode(selectedId)); });
document.getElementById("addSibBtn").addEventListener("click", () => { if (selectedId) addSibling(findNode(selectedId)); });
document.getElementById("deleteNode").addEventListener("click", deleteSelected);

// ---------- plegar / desplegar todo ----------
function setCollapsedAll(val, keepRoot) {
  const root = activeMap().root;
  (function walk(n) {
    if (n.children.length && !(keepRoot && n === root)) n.collapsed = val;
    n.children.forEach(walk);
  })(root);
  save(); renderMap(); centerView();
}
document.getElementById("collapseAll").addEventListener("click", () => setCollapsedAll(true, true));
document.getElementById("expandAll").addEventListener("click", () => setCollapsedAll(false, false));

// ---------- maps management ----------
function switchMap(id) {
  state.activeMapId = id; selectedId = null; save();
  renderSidebar(); renderMap(); centerView();
}
async function deleteMap(id) {
  if (state.maps.length === 1) { showHint("Debe quedar al menos un mapa"); return; }
  const ok = await askConfirm("Eliminar mapa", "¿Seguro que quieres eliminar este mapa? No se puede deshacer.");
  if (!ok) return;
  state.maps = state.maps.filter(m => m.id !== id);
  if (state.activeMapId === id) state.activeMapId = state.maps[0].id;
  save(); renderSidebar(); renderMap(); centerView();
}
async function renameMap(id) {
  const m = state.maps.find(x => x.id === id);
  const name = await askText("Nombre del mapa", m.name);
  if (name && name.trim()) { m.name = name.trim(); save(); renderSidebar(); document.getElementById("mapTitle").textContent = m.name; }
}
document.getElementById("newMapBtn").addEventListener("click", async () => {
  const name = await askText("Nuevo mapa", "Mapa " + (state.maps.length + 1));
  if (name === null) return;
  const id = "m_" + uid();
  state.maps.push({ id, name: (name && name.trim()) || ("Mapa " + (state.maps.length + 1)), root: newNode("Idea central") });
  switchMap(id);
});

// ---------- pan, pinch-zoom & doble-toque (ratón + táctil) ----------
const activePointers = new Map();
let panStart = null, pinch = null, downInfo = null, lastCanvasTap = 0;
function pinchMid() {
  const pts = [...activePointers.values()];
  const r = canvas.getBoundingClientRect();
  return { x: (pts[0].x + pts[1].x) / 2 - r.left, y: (pts[0].y + pts[1].y) / 2 - r.top,
           dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) };
}
canvas.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".node") || e.target.closest("#panel") || e.target.closest("#zoomctl")) return;
  if (e.button && e.button !== 0) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 1) {
    downInfo = { x: e.clientX, y: e.clientY, moved: false, type: e.pointerType };
    panStart = { x: e.clientX - view.tx, y: e.clientY - view.ty };
    canvas.classList.add("panning");
  } else if (activePointers.size === 2) {
    panStart = null;
    const m = pinchMid();
    pinch = { dist: m.dist, s: view.s, wx: (m.x - view.tx) / view.s, wy: (m.y - view.ty) / view.s };
  }
});
document.addEventListener("pointermove", (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && activePointers.size >= 2) {
    const m = pinchMid();
    let s = Math.min(2.5, Math.max(0.2, pinch.s * (m.dist / pinch.dist)));
    view.s = s; view.tx = m.x - pinch.wx * s; view.ty = m.y - pinch.wy * s; applyView();
  } else if (panStart) {
    if (downInfo && (Math.abs(e.clientX - downInfo.x) + Math.abs(e.clientY - downInfo.y) > 4)) downInfo.moved = true;
    view.tx = e.clientX - panStart.x; view.ty = e.clientY - panStart.y; applyView();
  }
});
function endCanvasPointer(e) {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinch = null;
  if (activePointers.size === 0) {
    panStart = null; canvas.classList.remove("panning");
    if (downInfo && !downInfo.moved) deselect();
    downInfo = null;
  } else if (activePointers.size === 1) {
    const p = [...activePointers.values()][0];
    panStart = { x: p.x - view.tx, y: p.y - view.ty };
  }
}
document.addEventListener("pointerup", endCanvasPointer);
document.addEventListener("pointercancel", endCanvasPointer);
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = (mx - view.tx) / view.s, wy = (my - view.ty) / view.s;
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  view.s = Math.min(2.5, Math.max(0.2, view.s * factor));
  view.tx = mx - wx * view.s; view.ty = my - wy * view.s;
  applyView();
}, { passive: false });

function zoomBy(f) {
  const mx = canvas.clientWidth / 2, my = canvas.clientHeight / 2;
  const wx = (mx - view.tx) / view.s, wy = (my - view.ty) / view.s;
  view.s = Math.min(2.5, Math.max(0.2, view.s * f));
  view.tx = mx - wx * view.s; view.ty = my - wy * view.s; applyView();
}
document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.15));
document.getElementById("zoomOut").addEventListener("click", () => zoomBy(0.87));
document.getElementById("zoomReset").addEventListener("click", () => centerView());

function bounds() {
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  visibleNodes.forEach(n => {
    const p = pos[n.id]; if (!p) return;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h);
  });
  if (minX === 1e9) return null;
  return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
}
function centerView() {
  const b = bounds();
  if (!b) { view = { tx: 0, ty: 0, s: 1 }; applyView(); return; }
  const s = Math.min(1.1, Math.min(canvas.clientWidth / (b.w + 140), canvas.clientHeight / (b.h + 140)));
  view.s = Math.max(0.2, s);
  view.tx = (canvas.clientWidth - b.w * view.s) / 2 - b.minX * view.s;
  view.ty = (canvas.clientHeight - b.h * view.s) / 2 - b.minY * view.s;
  applyView();
}
// asegura que un nodo concreto quede a la vista (sin cambiar zoom)
function centerOn(id) {
  const p = pos[id]; if (!p) return;
  const cx = (p.x + p.w / 2) * view.s + view.tx;
  const cy = (p.y + p.h / 2) * view.s + view.ty;
  const margin = 80;
  if (cx < margin) view.tx += (margin - cx);
  if (cx > canvas.clientWidth - margin) view.tx -= (cx - (canvas.clientWidth - margin));
  if (cy < margin) view.ty += (margin - cy);
  if (cy > canvas.clientHeight - margin) view.ty -= (cy - (canvas.clientHeight - margin));
  applyView();
}

// ---------- teclado ----------
document.addEventListener("keydown", (e) => {
  const editing = document.activeElement &&
    (document.activeElement.tagName === "TEXTAREA" || document.activeElement.tagName === "INPUT" ||
     document.activeElement.getAttribute("contenteditable") === "true");
  if (editing) return;
  if (!selectedId) return;
  const node = findNode(selectedId);
  if (!node) return;
  if (e.key === "Tab") { e.preventDefault(); addChild(node); }
  else if (e.key === "Enter") { e.preventDefault(); addSibling(node); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSelected(); }
});

// ---------- hint ----------
let hintTimer;
function showHint(text) {
  const h = document.getElementById("hint");
  h.textContent = text; h.classList.add("show");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.classList.remove("show"), 3000);
}

// ---------- export PNG ----------
document.getElementById("exportPng").addEventListener("click", () => {
  const b = bounds(); if (!b) return;
  const pad = 60;
  const W = b.w + pad * 2, H = b.h + pad * 2, scale = 2;
  const cv = document.createElement("canvas");
  cv.width = W * scale; cv.height = H * scale;
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
  const ox = (v) => v - b.minX + pad, oy = (v) => v - b.minY + pad;
  // edges
  visibleNodes.forEach(n => {
    const p = parentMap[n.id]; if (!p) return;
    const a = pos[p.id], c = pos[n.id];
    const ax = ox(a.x + a.w), ay = oy(a.y + a.h / 2), bx = ox(c.x), by = oy(c.y + c.h / 2), mx = (ax + bx) / 2;
    ctx.strokeStyle = COLORS[n.color || 0].border; ctx.globalAlpha = 0.5; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.bezierCurveTo(mx, ay, mx, by, bx, by); ctx.stroke();
    ctx.globalAlpha = 1;
  });
  // nodes
  const map = activeMap();
  visibleNodes.forEach(n => {
    const p = pos[n.id], c = COLORS[n.color || 0];
    roundRect(ctx, ox(p.x), oy(p.y), p.w, p.h, 12);
    ctx.fillStyle = c.bg; ctx.fill();
    ctx.strokeStyle = c.border; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = c.text;
    ctx.font = (n === map.root ? "bold 15px " : "13px ") + "-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.textBaseline = "top";
    wrapText(ctx, n.text, ox(p.x) + 14, oy(p.y) + 11, p.w - 28, 18);
  });
  const a = document.createElement("a");
  a.download = (map.name || "mapa") + ".png"; a.href = cv.toDataURL("image/png"); a.click();
  showHint("PNG exportado");
});
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(/\s+/); let line = "", yy = y;
  words.forEach(w => {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = t;
  });
  if (line) ctx.fillText(line, x, yy);
}

// ---------- export / import JSON ----------
document.getElementById("exportJson").addEventListener("click", () => {
  const map = activeMap();
  const blob = new Blob([JSON.stringify(map, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = (map.name || "mapa") + ".json"; a.click();
  showHint("JSON exportado");
});
document.getElementById("importJson").addEventListener("click", () => document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const id = "m_" + uid();
      let map;
      if (data.root) map = { id, name: data.name || "Importado", root: data.root };
      else if (data.nodes) map = migrateMap({ id, name: data.name || "Importado", nodes: data.nodes, edges: data.edges });
      else throw new Error();
      state.maps.push(map); switchMap(id); showHint("Mapa importado");
    } catch (err) { showHint("Archivo no válido"); }
  };
  reader.readAsText(f);
  e.target.value = "";
});

// ---------- init ----------
renderSidebar();
renderMap();
centerView();
showHint("Selecciona una idea y pulsa el «+» o Tab para crear una rama hija · Enter = hermana · doble clic para editar");
</script>
</body>
